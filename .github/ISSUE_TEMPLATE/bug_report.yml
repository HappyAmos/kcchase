name: Bug Report
description: Report a defect, visual glitch, or unexpected behavior in kcchase
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact command/flags and steps to reproduce the behavior.
      placeholder: |
        1. Run `kcchase --intermission`
        2. Resize terminal window
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, terminal emulator, and output of `kcchase --version` and `kcchase --info`.
      placeholder: |
        - OS: Linux / macOS
        - Terminal: Alacritty / Kitty / GNOME Terminal / tmux
        - `kcchase --version`:
        - `kcchase --info`:
    validations:
      required: true
